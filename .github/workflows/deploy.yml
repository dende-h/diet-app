name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # 公開してよい鍵（ビルド時に埋め込まれる）。Variables と Secrets のどちらに登録してもよい
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY || secrets.VITE_CLERK_PUBLISHABLE_KEY }}
    steps:
      # 設定漏れは実行結果の Annotations に出す（ログはログインしないと見られないため）
      - name: Check repository settings
        run: |
          missing=0
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Secret CLOUDFLARE_API_TOKEN is not set"; missing=1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is not set"; missing=1; }
          [ -n "$VITE_CLERK_PUBLISHABLE_KEY" ] || { echo "::error::VITE_CLERK_PUBLISHABLE_KEY is not set (Variable or Secret)"; missing=1; }
          exit $missing
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Apply D1 migrations
        run: bash scripts/ci-wrangler.sh d1 migrations apply DB --remote
      - name: Deploy
        run: bash scripts/ci-wrangler.sh deploy
